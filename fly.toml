# fly.toml app configuration file generated for cms-sings on 2026-08-18T01:07:09-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cms-sings'
primary_region = 'iad'
console_command = '/rails/bin/rails console'

[build]
[deploy]
  release_command = "./bin/rails db:prepare"

[env]
  PORT = '8080'

[processes]
  app = "./bin/rails server"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
